[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "promotion-tracker"
version = "0.1.0"
description = "Coleta e extração de ofertas comerciais a partir de Stories."
readme = { file = "read.me", content-type = "text/markdown" }
requires-python = ">=3.10"
dependencies = [
	"numpy>=1.24",
	"ollama>=0.4",
	"Pillow>=10.0",
	"playwright>=1.45",
	"pydantic>=2.7",
	"python-dotenv>=1.0",
	"PyYAML>=6.0",
]

[project.optional-dependencies]
ocr = ["onnxruntime>=1.18", "paddleocr>=3.0"]
fuzzy = ["rapidfuzz>=3.9"]
enhancement = ["opencv-contrib-python>=4.10"]

[project.scripts]
promotion-tracker = "promotion_tracker.main:main"

[tool.poetry]
packages = [{ include = "promotion_tracker", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.6"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]