[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promotion-tracker"
version = "0.1.0"
description = "Coleta e extração de ofertas comerciais a partir de Stories."
readme = { file = "read.me", content-type = "text/markdown" }
requires-python = ">=3.10"
dependencies = [
	"numpy>=1.24",
	"ollama>=0.4",
	"Pillow>=10.0",
	"playwright>=1.45",
	"pydantic>=2.7",
	"python-dotenv>=1.0",
	"PyYAML>=6.0",
]

[project.optional-dependencies]
ocr = [
	"onnxruntime>=1.18",
	"paddleocr>=3.0",
]
fuzzy = ["rapidfuzz>=3.9"]
enhancement = ["opencv-contrib-python>=4.10"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
promotion-tracker = "promotion_tracker.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["promotion_tracker*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]